<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="fragments/head :: head('Cadastrar Usuário')">
	<link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container">
    <h1 th:text="${#lists.isEmpty(user.id) ? 'Novo Usuário' : 'Editar Usuário'}">Usuário</h1>

    <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="name">Nome:</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>

        <div>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" th:field="*{cpf}" required>
        </div>

        <div>
            <label for="password">Senha:</label>
            <input type="password" id="password" th:field="*{password}" th:placeholder="${user.id != null ? 'Deixe em branco para manter' : ''}" />
        </div>

        <div style="margin-top: 15px;">
            <button type="submit" class="btn">Salvar</button>
            <a th:href="@{/admin/users}" class="btn">Cancelar</a>
        </div>
    </form>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
