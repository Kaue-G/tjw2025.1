<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro</title>
    <link rel="stylesheet" href="/css/styles.css"> <!-- Link para seus estilos -->
</head>
<body>
    <div class="error-container">
        <h1>Algo deu errado!</h1>
        <p>Desculpe, houve um problema ao processar sua solicitação. Por favor, tente novamente mais tarde.</p>
        <p>Status do erro: <b th:text="${status}"></b></p>
        <p th:text="${message}"></p>
        <a href="/home">Voltar para a página inicial</a>
    </div>
</body>
</html>
