<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Subject Form</title>
    <div layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/registration-form.css}">
    </div>
</head>
<body>
    <section layout:fragment="content">
		<h1 id="registrationFormTitle" th:text="${registration.id == null ? 'Nova Matrícula' : 'Editar Matrícula'}"></h1>

        <form id="registrationForm" th:action="@{/admin/matriculas/salvar}" th:object="${registration}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="studentId">Aluno:</label>
                <select th:field="*{studentId}" required>
                    <option th:each="aluno : ${students}"
                            th:value="${aluno.id}"
                            th:text="${aluno.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="classId">Turma:</label>
                <select th:field="*{classId}" required>
                    <option th:each="turma : ${classes}"
                            th:value="${turma.id}"
                            th:text="${turma.subjectName}">
                    </option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" th:field="*{active}" id="active"/>
                <label for="active">Ativa</label>
            </div>

            <button type="submit">Salvar</button>
        </form>

        <a href="/admin/matriculas">Voltar</a>
    </section>
</body>
</html>
